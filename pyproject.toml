[project]
name = "markpull"
version = "0.1.0"
description = "Pull clean markdown from URLs, HTML files, and PDFs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "docling>=2.96.1",
    "httpx>=0.27.0",
    "rich>=15.0.0",
    "typer>=0.21.2",
]

[project.scripts]
markpull = "cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["."]
include = ["cli.py", "converter.py"]
